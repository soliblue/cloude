name: Build Linux Daemon

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to publish under
        required: false
        type: string
  push:
    tags:
      - 'linux-daemon-v*'

concurrency:
  group: linux-agent-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd daemons/linux
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Linux daemon tests
        run: |
          cd daemons/linux
          npm test

      - name: Validate release tag and package verified archive
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          VERSION=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ] || [ -n "$RELEASE_TAG" ]; then
            [[ "$TAG" =~ ^linux-daemon-v[0-9]{1,6}(\.[0-9]{1,6}){2,3}$ ]] || { echo "Invalid Linux release tag"; exit 1; }
            git rev-parse --verify "refs/tags/$TAG" >/dev/null
            [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)" ] || { echo "Release tag must identify the checked out commit"; exit 1; }
            VERSION="${TAG#linux-daemon-v}"
          fi
          node daemons/linux/scripts/package-release.mjs "$VERSION" "$PWD/cloude-linux-daemon.tar.gz"

      - name: Upload artifact
        if: github.ref_type != 'tag' && github.event.inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: cloude-linux-daemon-archive
          path: |
            cloude-linux-daemon.tar.gz
            cloude-linux-daemon.tar.gz.sha256

      - name: Publish release asset
        if: github.ref_type == 'tag' || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          TITLE="Afto Linux Daemon ${TAG#linux-daemon-v}"
          NOTES="Remote Codex and Claude agents using existing subscriptions, with durable task streams, files, Git, approvals, and host sections."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TITLE" --notes "$NOTES"
          [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true ] || { echo "Refusing to replace an already published release"; exit 1; }
          gh release upload "$TAG" cloude-linux-daemon.tar.gz cloude-linux-daemon.tar.gz.sha256 --clobber
          EXPECTED="sha256:$(cut -d ' ' -f1 cloude-linux-daemon.tar.gz.sha256)"
          ACTUAL=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "cloude-linux-daemon.tar.gz") | .digest')
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "Published archive digest is missing or mismatched"; exit 1; }
          gh release edit "$TAG" --draft=false
