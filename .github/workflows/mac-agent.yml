name: Build Mac Daemon

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to publish the DMG under
        required: false
        type: string
  push:
    tags:
      - 'macos-daemon-v*'

concurrency:
  group: mac-agent-dmg
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Install fastlane
        run: gem install fastlane

      - name: Install cloudflared
        run: brew list cloudflared >/dev/null 2>&1 || brew install cloudflared

      - name: Stamp daemon version
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          VERSION=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ] || [ -n "$RELEASE_TAG" ]; then
            [[ "$TAG" =~ ^macos-daemon-v[0-9]{1,6}(\.[0-9]{1,6}){2,3}$ ]] || { echo "Invalid macOS release tag"; exit 1; }
            git rev-parse --verify "refs/tags/$TAG" >/dev/null
            [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)" ] || { echo "Release tag must identify the checked out commit"; exit 1; }
            VERSION="${TAG#macos-daemon-v}"
          fi
          sed -i '' "s/static let current = \"dev\"/static let current = \"${VERSION}\"/" daemons/macos/src/Version.swift
          cat daemons/macos/src/Version.swift

      - name: Decode Developer ID certificate
        env:
          MAC_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_BASE64 }}
        run: |
          mkdir -p certs
          echo "$MAC_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > certs/mac-developer-id.p12

      - name: Build and notarize DMG
        env:
          SIGNING_CERT_PATH: ../certs/mac-developer-id.p12
          SIGNING_CERT_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd fastlane
          fastlane mac release_agent

      - name: Zip .app for self-update
        run: |
          cd "build/release"
          ditto -c -k --keepParent "Remote CC Daemon.app" "Remote-CC-Daemon.app.zip"

      - name: Upload artifact
        if: github.ref_type != 'tag' && github.event.inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: Remote-CC-Daemon-dmg
          path: |
            build/release/Remote-CC-Daemon.dmg
            build/release/Remote-CC-Daemon.app.zip

      - name: Publish release asset
        if: github.ref_type == 'tag' || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          TITLE="Afto macOS Daemon ${TAG#macos-daemon-v}"
          NOTES="Remote Codex and Claude agents using existing subscriptions, with durable task streams, files, Git, approvals, and interactive terminals."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TITLE" --notes "$NOTES"
          [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true ] || { echo "Refusing to replace an already published release"; exit 1; }
          gh release upload "$TAG" build/release/Remote-CC-Daemon.dmg --clobber
          gh release upload "$TAG" build/release/Remote-CC-Daemon.app.zip --clobber
          RELEASE_ID=$(gh release view "$TAG" --json databaseId --jq '.databaseId')
          for ASSET in Remote-CC-Daemon.dmg Remote-CC-Daemon.app.zip; do
            EXPECTED="sha256:$(shasum -a 256 "build/release/$ASSET" | cut -d ' ' -f1)"
            ACTUAL=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq ".assets[] | select(.name == \"$ASSET\") | .digest")
            [ "$ACTUAL" = "$EXPECTED" ] || { echo "Release asset digest is missing or mismatched"; exit 1; }
          done
          gh release edit "$TAG" --draft=false

      - name: Cleanup
        if: always()
        run: rm -rf certs/
